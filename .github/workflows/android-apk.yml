# Frostora — Android APK build (GitHub Actions)
#
# Builds the Capacitor debug APK from the DEPLOYED Frostora URL.
# Runs on demand (Actions → Run workflow) or on pushes to main.
# Requires the repository secret FROSTORA_URL to be set to the public
# deployed app URL, e.g. https://frostora.vercel.app
# (Settings → Secrets and variables → Actions → New repository secret).
# The APK is uploaded as a workflow artifact — download it from the
# finished run and sideload it on the phone.
#
# Why CI and not the Muse VM: the VM's sandbox blocks the Gradle
# daemon's loopback TCP, so Gradle cannot run there. GitHub-hosted
# runners have no such restriction.
name: Frostora Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frostora-android/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check FROSTORA_URL secret is set
        run: |
          if [ -z "${{ secrets.FROSTORA_URL }}" ]; then
            echo "ERROR: set the FROSTORA_URL repository secret to the deployed Frostora URL first." >&2
            exit 1
          fi

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frostora-android/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's ubuntu runners already ship an Android SDK, but
      # android-actions/setup-android@v3 fails on it (it re-downloads
      # cmdline-tools 16.0 and its --licenses step exits 1 with
      # "Failed to find package 'tools'"). Use the preinstalled SDK
      # directly instead: install the API 35 platform + build-tools
      # the project targets (compileSdk/targetSdk 35) and accept
      # licenses with the runner's own sdkmanager.
      - name: Set up Android SDK (preinstalled)
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Capacitor dependencies
        working-directory: frostora-android
        run: npm ci

      - name: Sync Android project
        working-directory: frostora-android
        env:
          FROSTORA_URL: ${{ secrets.FROSTORA_URL }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frostora-android
        env:
          FROSTORA_URL: ${{ secrets.FROSTORA_URL }}
        run: ./android/gradlew -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frostora-debug-apk
          path: frostora-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
